<style>

:root[data-theme=dark]{--sea:#1b2a3a;--land:#1a1f28;--bg:#14171d;--fg:#eceff4;--card:#1e232c;--line:#3a4250;--mut:#9aa3b2;--c:#2b3140;--un:#2f8f63;--acc:#5aa9ea;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:760px;margin:0 auto;padding:14px}h1{font-size:1.5rem;margin:.2em 0}h2{font-size:1.1rem;margin:.2em 0 .5em}.mut,small{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
button,input,select,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
button{cursor:pointer}button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}button.ok{background:var(--un);color:#fff;border-color:var(--un)}button.no{background:var(--bad);color:#fff;border-color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 auto}input.code{text-transform:uppercase;letter-spacing:.3em;text-align:center;width:7em;flex:0 1 auto}
textarea{width:100%;min-height:70px}.sc{overflow-x:auto}table{border-collapse:collapse;width:100%}td{padding:3px}td input,td select{width:100%;min-width:70px}
.big{font-size:2.6rem;font-weight:800;letter-spacing:.2em;text-align:center;display:block}.ch{display:flex;flex-direction:column;gap:4px;text-align:left;width:100%;margin:6px 0}.ch.cd{opacity:.55}.bad{color:var(--bad)}
.cardb{display:flex;flex-direction:column;text-align:left;width:100%;margin:6px 0}
svg{width:100%;height:auto;display:block;border-radius:12px}svg text{font-size:11px;fill:var(--fg);pointer-events:none}
.lg{display:flex;gap:10px;flex-wrap:wrap;font-size:.8rem}.lg i{display:inline-block;width:18px;height:4px;vertical-align:middle;margin-right:4px}
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}.md{background:var(--card);border-radius:14px;padding:16px;max-width:460px;width:100%;max-height:85vh;overflow:auto}
#toast{position:fixed;left:50%;transform:translate(-50%,-150%);top:calc(10px + env(safe-area-inset-top,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:9;transition:.3s;max-width:90vw}#toast.show{transform:translate(-50%,0)}
.hand{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 10px;scroll-snap-type:x mandatory}
.pc{flex:0 0 138px;scroll-snap-align:start;aspect-ratio:5/7;border-radius:14px;border:3px solid var(--cc);background:linear-gradient(180deg,var(--card),var(--bg));box-shadow:0 3px 10px #0003;display:flex;flex-direction:column;padding:6px;text-align:center;overflow:hidden}
.pc .nm{font-weight:800;font-size:.82rem;background:var(--cc);color:#fff;border-radius:8px;padding:3px 4px;line-height:1.1}
.pc .art{flex:0 0 34%;display:flex;align-items:center;justify-content:center;font-size:2.2rem;border:2px solid var(--cc);border-radius:8px;margin:5px 0;background:color-mix(in srgb,var(--cc) 14%,var(--card))}
.pc .tx{flex:1;overflow:auto;line-height:1.2;font-size:.72rem}.pc .tg{font-size:.58rem;text-transform:uppercase;letter-spacing:.05em;color:var(--cc);font-weight:700;margin-top:2px}
.pc button{margin-top:4px;padding:4px 6px}
.stats{width:100%}.stats td,.stats th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left}.stats td+td,.stats th+th{text-align:center}
.win{background:var(--un);color:#fff;text-align:center;font-weight:700}.rule{border-left:5px solid var(--acc)}

  `<text x="281" y="318" text-anchor="middle" style="font-size:13px;${H}">\u2605</text><text x="281" y="318" text-anchor="middle" style="font-size:13px;fill:var(--fg)">\u2605</text>`+

const home=()=>`<h1>🏁 Bay Area County Race</h1><p class="mut">A Jet Lag-style race. Complete challenges to unlock every county, then get back to the finish first.</p>

const setup=()=>`<h1>Game setup</h1><div class="card"><div class="row"><label>Start<input value="${e(S.start)}" oninput="S.start=this.value"></label><label>Finish<input value="${e(S.end)}" oninput="S.end=this.value"></label></div><p><button onclick="sample()">Load sample challenges and cards</button></p></div>

<button onclick="S.ch.push({t:'',m:0,p:0,d:1,r:'',s:false});render()">+ Row</button></div>
<div class="card"><h2>Reward cards (${S.cards.length})</h2><p class="mut">Paste lines like: Card name | Description | flags (write “skip” to skip a county, “affects” if it hits the other team, “remove” to remove one of your challenges, “double” for a double draw)</p><textarea id="pd"></textarea><button onclick="pasteCd()">Add pasted cards</button>
<div class="sc"><table>${S.cards.map((c,i)=>`<tr><td><input value="${e(c.n)}" oninput="S.cards[${i}].n=this.value"></td><td><input value="${e(c.d)}" oninput="S.cards[${i}].d=this.value"></td><td><label><input type="checkbox" style="min-width:0"${c.s?' checked':''} onchange="S.cards[${i}].s=this.checked"> skip</label><br><label><input type="checkbox" style="min-width:0"${c.x?' checked':''} onchange="S.cards[${i}].x=this.checked"> hits other team</label><br><label><input type="checkbox" style="min-width:0"${c.z?' checked':''} onchange="S.cards[${i}].z=this.checked"> removes a challenge</label><br><label><input type="checkbox" style="min-width:0"${c.w?' checked':''} onchange="S.cards[${i}].w=this.checked"> double draw</label></td><td><button onclick="S.cards.splice(${i},1);render()">×</button></td></tr>`).join('')}</table></div>
<button onclick="S.cards.push({n:'',d:'',s:false});render()">+ Row</button></div>
<div class="row"><button onclick="S.view='home';render()">Back</button><button class="pri" onclick="create()">Start game</button></div>`;
const lobby=()=>{const g=S.g;return `<h1>Lobby</h1><div class="card"><p class="mut" style="text-align:center">${S.practice?'Practice game':'Tell the other player this code'}</p><b class="big">${S.code}</b></div>
<div class="card"><p>Route: <b>${e(g.start)}</b> → every county → <b>${e(g.end)}</b></p><p>${g.ch.length} challenges · ${g.cards.length} cards</p>
<p>Team A (host): ${g.rA?'✅ Ready':'⏳ Not ready'}<br>Team B: ${!g.guest?'⏳ Waiting to join…':g.rB?'✅ Ready':'⏳ Not ready'}</p>
<div class="row"><button class="pri" onclick="ready()" ${g['r'+S.me]?'disabled':''}>${g['r'+S.me]?'Waiting for the other team…':'Ready'}</button>${S.practice?`<button onclick="swap()">Switch to Team ${S.me=='A'?'B':'A'}</button>`:''}</div><p class="mut">You are Team ${S.me}.</p></div>`};
function cardHtml(x,btn){const f=[];if(x.s)f.push(['⏭️','Skip a county','#2e8b57']);if(x.x)f.push(['⚡','Hits other team','#e08a00']);if(x.z)f.push(['🗑️','Remove a challenge','#c0392b']);if(x.w)f.push(['🃏','Double draw','#7b3fa0']);
  const m=f[0]||['✨','Special','#1f6fb2'];
  return `<div class="pc" style="--cc:${m[2]}"><div class="nm">${e(x.n)}</div><div class="art">${m[0]}</div><div class="tx">${e(x.d)}</div><div class="tg">${f.map(a=>a[1]).join(' · ')||'Special'}</div>${btn||''}</div>`}
const al=()=>S.alert?`<div class="ov"><div class="md" style="text-align:center"><h2>⚠️ Team ${S.alert.o} played a card on you</h2><div class="hand" style="justify-content:center">${cardHtml({...S.alert.v.a,x:1})}</div><button class="pri" onclick="S.alert=null;render()">Got it</button></div></div>`:'';
function game(){
  const g=S.g,t=g['t'+S.me],ot=S.me=='A'?'B':'A',o=g['t'+ot],c=cov(t),bd=boardOf(g),left=g.order.filter(i=>!usedSet(g).has(i)).length-bd.length;
  return (g.win?`<div class="card win">${g.win==S.me?'🎉 You won the race!':'Team '+g.win+' won the race.'}<div class="row" style="margin-top:8px"><button onclick="S.view='review';render()">📊 Game review</button><button onclick="restart()">Play again</button></div></div>`:'')+
  `<div class="row"><h1 style="flex:1">Team ${S.me}</h1><small>Game ${S.code}</small>${S.practice?`<button onclick="swap()">Switch to Team ${ot}</button>`:''}</div>
  <div class="card rule"><b>The rule:</b> counties must be done in this order: Santa Clara → Alameda → Contra Costa → Solano → Napa → Sonoma → Marin → San Francisco → San Mateo. You can’t enter the next county until you complete a challenge. Next up: <b>${nxt(t)||'the finish!'}</b></div>
  <div class="card"><h2>Map · You ${c.length}/9 · Team ${ot} ${cov(o).length}/9</h2>${mapSvg(t,o)}<label class="mut"><input type="checkbox"${S.rail===false?'':' checked'} onchange="S.rail=this.checked;render()"> Show transit lines & stations</label>${c.length==9&&!g.win?`<button class="pri" onclick="finish()">We’re back at ${e(g.end)}!</button>`:''}</div>
  <div class="card"><h2>Challenges (shared board)</h2>${bd.map(ci=>{const x=g.ch[ci],lk=(t.lk||{})[ci]||0,ol=(o.lk||{})[ci]||0,cd=lk>Date.now();return `<button class="ch ${cd?'cd':''}" onclick="openCh(${ci})"><b>${e(x.t)}</b><small>🃏 Draw ${x.d||1} card${(x.d||1)>1?'s':''}, keep 1 · ${x.m?'⏱ '+x.m+' min limit'+(x.s?', you press START':', starts when you open it'):'No time limit'}${x.p?' · ⛔ '+x.p+' min penalty if failed':''}</small>${cd?`<small class="bad">You’re locked out <span data-u="${lk}" data-d="ready"></span></small>`:''}${ol>Date.now()?`<small>Team ${ot} is locked out of this one.</small>`:''}</button>`}).join('')||'<p class="mut">No challenges left.</p>'}<small>Both teams see the same challenges. If one team fails, the other can still try it. Once a challenge is completed or removed, it’s retired for everyone. ${Math.max(0,left)} more waiting.${t.dd>1?' 🃏 Double draw is on: your next reward shows '+t.dd+'× as many cards.':''}</small></div>
  <div class="card"><h2>Your hand (only you see this)</h2><div class="hand">${S.hand.map((x,i)=>cardHtml(x,`<button onclick="play(${i})">Play</button>`)).join('')||'<p class="mut">No cards yet.</p>'}</div></div>
  <div class="card"><button onclick="restart()">\u21ba Restart game</button></div>`}
function modal(){
  const m=S.modal;if(!m)return '';const g=S.g;let h='';
  if(m.k=='ch'){const t=g['t'+S.me],x=g.ch[m.i],st=(t.st||{})[m.i];
    h=`<h2>${e(x.t)}</h2><p>Completing this unlocks <b>${nxt(t)}</b>.</p><p>🃏 Draw ${x.d||1}, keep 1</p><p><b>Criteria:</b> ${x.r?e(x.r):'None listed.'}</p><p>${x.m?`⏱ ${x.m} min limit ${st?`<b class="big" data-u="${st+x.m*60000}" data-d="Time’s up ⏰" data-k="1">…</b>`:x.s?`<button class="pri" onclick="startTm(${m.i})">START timer</button><br><small>The clock only runs after you press START.</small>`:'(timer starting…)'}`:'No time limit'}</p><div class="row"><button class="ok" onclick="done(${m.i})">Completed ✓</button><button class="no" onclick="fail(${m.i})">Failed ✗</button></div>`}
  else if(m.k=='rw')h=`<h2>You drew ${m.n} card${m.n>1?'s':''}. Keep one!</h2><div class="hand" style="flex-wrap:wrap;justify-content:center">`+m.o.map((x,k)=>cardHtml(x,`<button class="pri" onclick="pick(${k})">Keep</button>`)).join('')+`</div>`;
  else if(m.k=='rm')h=`<h2>Remove which challenge?</h2><p class="mut">It leaves the shared board for both teams and a new one takes its place.</p>`+boardOf(g).map(ci=>`<button class="cardb" onclick="use(${m.i},${ci})"><b>${e(g.ch[ci].t)}</b></button>`).join('');
  if(m.k=='rs')h=`<h2>Restart the game?</h2><p>Both teams go back to the lobby and start fresh with the same challenges and cards.</p><div class="row"><button class="no" onclick="doRestart()">Yes, restart</button><button onclick="closeM()">Cancel</button></div>`;
  return `<div class="ov"><div class="md">${h}${m.k=='rw'||m.k=='rs'?'':'<p><button onclick="closeM()">Close</button></p>'}</div></div>`}
const fmt=ms=>{const s=Math.max(0,Math.round(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(r).padStart(2,'0')};
function review(){
  const g=S.g,T={A:g.tA||{},B:g.tB||{}},L=x=>(T[x].lg||[]),all=[...L('A').map(v=>({...v,x:'A'})),...L('B').map(v=>({...v,x:'B'}))].sort((p,q)=>p.t-q.t);
  const t0=g.t0||(all[0]?all[0].t:0),t1=g.t1||(all.length?all[all.length-1].t:t0),span=Math.max(t1-t0,1000);
  const prog=x=>{let n=0;return L(x).filter(v=>v.k=='d'||(v.k=='p'&&v.y)).map(v=>({t:v.t-t0,n:++n}))};
  const col={A:'var(--acc)',B:'var(--opp)'},CW=400,CH=170,mx=26,my=14,X=t=>mx+(CW-mx-8)*Math.min(t,span)/span,Y=n=>CH-my-(CH-2*my)*n/9;
  const path=x=>{let d=`M${X(0)},${Y(0)}`;prog(x).forEach(v=>{d+=` H${X(v.t).toFixed(1)} V${Y(v.n).toFixed(1)}`});return d+` H${X(span).toFixed(1)}`};
  const chart=`<svg viewBox="0 0 ${CW} ${CH}" role="img" aria-label="Counties unlocked over time">`+[0,3,6,9].map(n=>`<line x1="${mx}" x2="${CW-8}" y1="${Y(n)}" y2="${Y(n)}" stroke="var(--line)" stroke-dasharray="2 3"/><text x="${mx-5}" y="${Y(n)+3}" text-anchor="end" style="font-size:9px;fill:var(--mut)">${n}</text>`).join('')+['A','B'].map(x=>`<path d="${path(x)}" fill="none" stroke="${col[x]}" stroke-width="2.5" stroke-linejoin="round"/>`).join('')+`<text x="${mx}" y="${CH-2}" style="font-size:9px;fill:var(--mut)">0:00</text><text x="${CW-8}" y="${CH-2}" text-anchor="end" style="font-size:9px;fill:var(--mut)">${fmt(span)}</text></svg>`;
  const st=x=>{const l=L(x),pr=prog(x),gaps=pr.map((v,i)=>v.t-(i?pr[i-1].t:0));return{un:(T[x].un||[]).length,sk:(T[x].sk||[]).length,done:l.filter(v=>v.k=='d').length,fail:l.filter(v=>v.k=='f').length,pen:l.filter(v=>v.k=='f').reduce((s,v)=>s+(v.p||0),0),cards:l.filter(v=>v.k=='p').length,rm:(T[x].rm||[]).length,fast:gaps.length?Math.min(...gaps):null,slow:gaps.length?Math.max(...gaps):null,avg:pr.length?pr[pr.length-1].t/pr.length:null}};
  const a=st('A'),b=st('B'),tm=v=>v==null?'–':fmt(v),row=(l,f)=>`<tr><td>${l}</td><td>${f(a)}</td><td>${f(b)}</td></tr>`;
  const cell=(x,k)=>{const v=L(x).find(z=>z.y==k&&(z.k=='d'||z.k=='p'));return v?(v.k=='d'?'✓ ':'⏭ ')+'+'+fmt(v.t-t0):'–'};
  const nm=c=>g.ch[c]?e(g.ch[c].t):'a challenge';
  const txt=v=>v.k=='d'?`completed “${nm(v.c)}” and unlocked ${v.y}`:v.k=='f'?`failed “${nm(v.c)}”${v.p?' (locked out '+v.p+' min)':''}`:`played “${e(v.n)}”${v.y?' and skipped '+v.y:''}${v.r?' and removed “'+e(v.r)+'”':''}`;
  const best=(k,lo)=>{const c=[['A',a[k]],['B',b[k]]].filter(z=>z[1]!=null);if(!c.length)return null;c.sort((p,q)=>lo?p[1]-q[1]:q[1]-p[1]);return c[0]};
  const f1=best('fast',1),s1=best('slow',0),c1=best('cards',0),x1=best('fail',0),hl=[];
  if(f1)hl.push(`⚡ Fastest county: Team ${f1[0]} (${fmt(f1[1])})`);if(s1)hl.push(`🐢 Longest stretch: Team ${s1[0]} (${fmt(s1[1])})`);if(c1&&c1[1]>0)hl.push(`🃏 Most cards played: Team ${c1[0]} (${c1[1]})`);if(x1&&x1[1]>0)hl.push(`💥 Most failed challenges: Team ${x1[0]} (${x1[1]})`);
  return `<h1>📊 Game review</h1><div class="card win"><b>${g.win?'🏆 Team '+g.win+' won the race'+(g.win==S.me?' (that’s you!)':''):'Game in progress'}</b><br>Total time: ${fmt(span)}</div>
  <div class="card"><h2>Counties over time</h2>${chart}<div class="lg"><span><i style="background:var(--acc)"></i>Team A</span><span><i style="background:var(--opp)"></i>Team B</span></div></div>
  <div class="card"><h2>Stats</h2><div class="sc"><table class="stats"><tr><th></th><th style="color:var(--acc)">Team A</th><th style="color:var(--opp)">Team B</th></tr>
  ${row('Counties unlocked',z=>z.un)}${row('Counties skipped',z=>z.sk)}${row('Challenges completed',z=>z.done)}${row('Challenges failed',z=>z.fail)}${row('Penalty minutes taken',z=>z.pen)}${row('Cards played',z=>z.cards)}${row('Challenges removed',z=>z.rm)}${row('Average time per county',z=>tm(z.avg))}${row('Fastest county',z=>tm(z.fast))}${row('Slowest county',z=>tm(z.slow))}</table></div></div>
  ${hl.length?`<div class="card"><h2>Highlights</h2>${hl.map(z=>`<p style="margin:.3em 0">${z}</p>`).join('')}</div>`:''}
  <div class="card"><h2>County by county</h2><div class="sc"><table class="stats"><tr><th>County</th><th style="color:var(--acc)">Team A</th><th style="color:var(--opp)">Team B</th></tr>${ORDER.map(k=>`<tr><td>${k}</td><td>${cell('A',k)}</td><td>${cell('B',k)}</td></tr>`).join('')}</table></div></div>
  <div class="card"><h2>Play by play</h2>${all.map(v=>`<p style="margin:.35em 0"><small>+${fmt(v.t-t0)}</small> <b style="color:${col[v.x]}">Team ${v.x}</b> ${txt(v)}</p>`).join('')||'<p class="mut">No events recorded.</p>'}</div>
  <div class="row"><button onclick="S.view='game';render()">Back to game</button><button class="pri" onclick="restart()">Play again</button></div>`}

function render(){const a=document.activeElement;if(a&&a.matches&&a.matches('#app input,#app textarea')&&S.view=='setup'&&event&&event.type=='input')return;
  $('#app').innerHTML=({home,setup,lobby,game,review}[S.view])()+modal()+al()}
setInterval(()=>{let r=0;document.querySelectorAll('[data-u]').forEach(x=>{const s=Math.ceil((x.dataset.u-Date.now())/1000);
  if(s<=0){x.textContent=x.dataset.d;if(!x.dataset.k){x.dataset.k=1;r=1}}else x.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')});if(r&&S.view=='game')render()},1000);
render();
</script></body></html>
